[package]
name = "turks"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "A movie collection manager (Radarr-style) with a classic JRPG menu look."
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "native-tls", "charset", "http2", "system-proxy", "gzip", "cookies", "multipart", "form", "query"] }
regex = "1"
fancy-regex = "0.14"
rusqlite = { version = "0.37", features = ["bundled"] }
roxmltree = "0.20"
tiny_http = "0.12"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
once_cell = "1.21"
sha2 = "0.11.1"
sha1 = "0.11"
base64 = "0.22"
rand = "0.9"
fs2 = "0.4"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "native-tls", "builder", "hostname"] }
unicode-normalization = "0.1"
walkdir = "2"
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
winreg = "0.56.0"
windows = { version = "0.62.2", features = ["Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }

[build-dependencies]
embed-resource = "3.0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[[bin]]
name = "turks"
path = "src/main.rs"
