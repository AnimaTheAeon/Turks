[package]
name = "turks"
version = "0.5.0"
edition = "2021"
build = "build.rs"
description = "A movie collection manager (Radarr-style) with a classic JRPG menu look."
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
rfd = { version = "0.17.2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "charset", "http2", "system-proxy", "gzip", "cookies", "multipart", "form", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
libc = { version = "0.2", optional = true }
regex = "1"
fancy-regex = "0.14"
rusqlite = { version = "0.37", features = ["bundled"] }
roxmltree = "0.20"
tiny_http = "0.12"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
once_cell = "1.21"
sha2 = "0.11.1"
sha1 = "0.11"
base64 = "0.22"
rand = "0.9"
fs2 = "0.4"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname"] }
unicode-normalization = "0.1"
walkdir = "2"
arboard = { version = "3", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
trash = "5.3"
tray-icon = { version = "0.21", optional = true }
winreg = { version = "0.56.0", optional = true }
windows = { optional = true, version = "0.62.2", features = ["Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }

[features]
default = ["gui"]
# The Windows desktop app.
gui = ["dep:eframe", "dep:rfd", "dep:arboard", "dep:image", "dep:tray-icon", "dep:winreg", "dep:windows", "reqwest/native-tls", "lettre/native-tls"]
# The Synology DSM package: headless service + web UI, static musl binary.
nas = ["reqwest/rustls-no-provider", "dep:rustls", "dep:libc", "lettre/rustls-tls"]

[build-dependencies]
embed-resource = "3.0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[[bin]]
name = "turks"
path = "src/main.rs"

