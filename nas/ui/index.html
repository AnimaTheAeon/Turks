<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turks</title>
<link rel="stylesheet" href="turks.css?v=@VERSION@">
</head>
<body>
<style>
/* Start screen: the app's emblem over its name while the page connects. Slow fades,
   nothing flashes; hidden with Reduce motion. */
#splash{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 42%,#101a6e 0%,#080c34 45%,#04040c 100%);
  --si:#f4f4f8;--sa:#70ccff;--sd:#aab2d6;color:var(--si);transition:opacity .6s ease}
#splash.green{background:radial-gradient(ellipse at 50% 42%,#165c10 0%,#0a3608 38%,#041c04 70%,#010a01 100%);--si:#e4ffc4;--sa:#c8ff4a;--sd:#a6dc80}
#splash.blades{background:linear-gradient(135deg,#cfcfcf 0%,#f2f2f2 50%,#c8c8c8 100%);--si:#2f2f2f;--sa:#5b5b5b;--sd:#6a6a6a}
#splash.glass{background:radial-gradient(900px 640px at 10% 6%,rgba(56,92,255,.38),transparent 60%),radial-gradient(820px 620px at 94% 24%,rgba(168,64,255,.26),transparent 62%),radial-gradient(900px 700px at 58% 112%,rgba(0,190,170,.2),transparent 60%),#04050a;--si:#ffffff;--sa:#ffffff;--sd:rgba(235,235,245,.62)}
#splash.glass .sp-title{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",Inter,system-ui,sans-serif;font-weight:600}
#splash.out{opacity:0;pointer-events:none}
#splash .sp-in{display:flex;flex-direction:column;align-items:center;animation:spIn 1s ease-out both}
#splash .sp-emblem{color:var(--sa)}
#splash .sp-title{margin:24px 0 0;padding-left:.42em;font-size:clamp(30px,8vw,52px);font-weight:700;letter-spacing:.42em;color:var(--si);text-transform:uppercase;white-space:nowrap}
#splash.green .sp-title{font-family:"Orbitron","Nunito",sans-serif;font-weight:800}
#splash .sp-bar{position:relative;margin-top:14px;width:min(300px,70vw);height:3px;overflow:hidden;border-radius:2px;animation:spBar 1.1s ease-out both}
#splash .sp-bar::before{content:"";position:absolute;inset:0;background:var(--sd);opacity:.35}
#splash .sp-bar i{position:absolute;top:0;bottom:0;left:-90px;width:90px;border-radius:2px;background:var(--sa);animation:spGlide 3.2s ease-in-out infinite}
#splash .sp-status{margin-top:16px;font-size:17px;letter-spacing:.04em;color:var(--sd);animation:spFade 1.2s ease-out .5s both}
@keyframes spIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spFade{from{opacity:0}to{opacity:1}}
@keyframes spBar{from{transform:scaleX(0)}to{transform:none}}
@keyframes spGlide{0%{left:-90px}100%{left:100%}}
@media (prefers-reduced-motion:reduce){#splash{display:none}}
#splash .sp-glint{animation:spGlint 6s ease-in-out infinite;transform:translateX(-140px)}
@keyframes spGlint{0%{transform:translateX(-140px)}45%,100%{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){#splash .sp-glint{animation:none}}
</style>
<div id="splash"><div class="sp-in"><svg class="sp-emblem" width="250" height="120" viewBox="-125 -62 250 124" aria-hidden="true">
  <defs><clipPath id="splL"><rect x="-98" y="-20" width="88" height="52" rx="16"/></clipPath><clipPath id="splR"><rect x="10" y="-20" width="88" height="52" rx="16"/></clipPath></defs>
  <rect x="-100" y="-43" width="200" height="6" rx="3" fill="currentColor" opacity=".85"/>
  <rect x="-13" y="-11" width="26" height="6" rx="3" fill="currentColor"/>
  <path d="M-98 -8l-24 -10M98 -8l24 -10" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="-98" y="-20" width="88" height="52" rx="16" fill="#050b16" stroke="currentColor" stroke-width="3.5"/>
  <rect x="10" y="-20" width="88" height="52" rx="16" fill="#050b16" stroke="currentColor" stroke-width="3.5"/>
  <rect x="-90" y="-15" width="72" height="7" rx="4" fill="#fff" opacity=".07"/>
  <rect x="18" y="-15" width="72" height="7" rx="4" fill="#fff" opacity=".07"/>
  <g clip-path="url(#splL)"><g class="sp-glint"><path d="M0 34l12 0 22 -56 -12 0z" fill="#fff" opacity=".16"/></g></g>
  <g clip-path="url(#splR)"><g class="sp-glint"><path d="M108 34l12 0 22 -56 -12 0z" fill="#fff" opacity=".16"/></g></g>
</svg><div class="sp-title">Turks</div><div class="sp-bar"><i></i></div><div class="sp-status">Movie manager&hellip;</div></div></div>
<script>
(function () {
  var s = document.getElementById('splash'); if (!s) return;
  try { var t = localStorage.getItem('turks-theme'); if (t === 'green' || t === 'blades' || t === 'glass') s.classList.add(t); } catch (e) {}
  var born = Date.now(), gone = false;
  function out() { if (gone) return; gone = true; s.classList.add('out'); setTimeout(function () { s.remove(); }, 700); }
  window.splashDone = function (theme) {
    try { if (theme) localStorage.setItem('turks-theme', theme); } catch (e) {}
    setTimeout(out, Math.max(0, 1800 - (Date.now() - born)));
  };
  setTimeout(out, 9000);
})();
</script>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- Pointing hand cursor (original artwork). -->
    <symbol id="hand" viewBox="0 0 34 22">
      <rect x="2" y="6" width="34" height="16" rx="5" fill="rgba(0,0,0,.35)" transform="translate(-1 0)"/>
      <rect x="1" y="4" width="8" height="15" rx="2" fill="#c4c8d6" stroke="#1e1e28" stroke-width="1.4"/>
      <rect x="7" y="3" width="15" height="16" rx="5" fill="#fafafc" stroke="#1e1e28" stroke-width="1.4"/>
      <rect x="17" y="5" width="16" height="6" rx="3" fill="#fafafc" stroke="#1e1e28" stroke-width="1.4"/>
      <rect x="17" y="11" width="7" height="4" rx="2" fill="#fafafc" stroke="#1e1e28" stroke-width="1.4"/>
      <rect x="17" y="15" width="7" height="4" rx="2" fill="#fafafc" stroke="#1e1e28" stroke-width="1.4"/>
      <path d="M10 7 L16 8" stroke="#c4c8d6" stroke-width="1.2"/>
    </symbol>
  </defs>
</svg>

<!-- Box of X: background grid and the home screen. -->
<svg id="gbg" preserveAspectRatio="none"></svg>
<div class="ghome" id="ghome">
  <div class="bigorb" id="bigorb"></div>
  <div id="gmenu"></div>
  <div class="gstatus" id="ghome-status" title="Open System"></div>
  <button class="ghint" id="gmode" title="Simple shows the settings most people need. Advanced shows everything Radarr has."><span class="node">MODE</span><span id="gmode-label">SIMPLE</span></button>
  <button class="ghint" id="genter" style="right:60px"><span class="node">ENTER</span>SELECT</button>
</div>

<div class="layout">
  <div id="gbar"><div class="gtitle" id="gtitle"></div><div class="gstatus" id="gstatus" title="Open System"></div></div>
  <section id="main" class="win"></section>

  <aside class="side">
    <nav id="menu" class="win"></nav>
    <div class="spacer"></div>
    <div class="win" id="info">
      <div class="info-row"><span class="label">Time</span><span id="i-time">--:--:--</span></div>
      <div class="info-row"><span class="label">Movies</span><span id="i-movies">0</span></div>
      <div class="info-row link" id="i-missing-row" title="Show missing movies"><span class="label">Missing</span><span id="i-missing">0</span></div>
      <div class="info-row"><span class="label">Disk</span><span id="i-disk">—</span></div>
      <button id="mode" class="mode">MODE: SIMPLE</button>
    </div>
  </aside>

  <button class="ghint" id="gback"><span class="node">ESC</span><span id="gback-label">BACK</span></button>

  <footer id="statusbar" class="win"><span class="badge good"></span><span id="status-text">Connecting…</span></footer>
</div>

<div id="modal" class="modal"></div>
<div id="toasts"></div>
<div id="upd" class="upd" hidden role="status" aria-live="polite"><div class="win updcard"><div class="updtitle"></div><div class="updbar"><i></i></div><div class="updline"><span class="updstep"></span><span class="updpct"></span></div><div class="updnote"></div><div class="updact"></div></div></div>
<div id="overlay" class="overlay-msg"><div class="win" style="max-width:460px"><h1 style="margin:0 0 6px;font-size:22px" id="overlay-title"></h1><div id="overlay-text"></div></div></div>

<script src="app.js?v=@VERSION@"></script>
<script src="forms.js?v=@VERSION@"></script>
<script src="movies.js?v=@VERSION@"></script>
<script src="add.js?v=@VERSION@"></script>
<script src="activity.js?v=@VERSION@"></script>
<script src="settings.js?v=@VERSION@"></script>
<script src="system.js?v=@VERSION@"></script>
<script>Turks.start();</script>
</body>
</html>
